<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Discovery radar rings -->
  <circle cx="60" cy="62" r="48" stroke="#0A59F7" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.25"/>
  <circle cx="60" cy="62" r="36" stroke="#0A59F7" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.45"/>
  <circle cx="60" cy="62" r="26" stroke="#0A59F7" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Primary host phone -->
  <rect x="50" y="42" width="20" height="38" rx="4" fill="white" stroke="#8A8A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Phone screen details -->
  <line x1="56" y1="47" x2="64" y2="47" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="72" r="1.5" fill="#8A8A8A"/>
